<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070707" />
    <!-- Theme before first paint, so a light-mode visitor never sees a dark flash.
         Dark unless they chose light, matching the product. -->
    <script>
      try {
        if (localStorage.getItem("kortex-theme") === "light") {
          document.documentElement.setAttribute("data-theme", "light");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#FDF9F3");
        }
      } catch (e) {}
    </script>
    <title>Kortex · Run growth from one Kortex, not nine dashboards</title>
    <meta
      name="description"
      content="Kortex coordinates 8 specialist AI agents across ads, store, SEO, creative and pages. Ask one growth question. Approve the moves. Ship growth without nine dashboards."
    />
    <meta name="author" content="Kortex" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- UI sans: Satoshi (Fontshare) -->
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700,900&display=swap"
      rel="stylesheet"
    />

    <meta property="og:title" content="Kortex · Run growth from one Kortex, not nine dashboards" />
    <meta
      property="og:description"
      content="Connect your stack. Ask one growth question. Approve the moves. Kortex coordinates 8 specialist AI agents across ads, store, SEO, creative and pages."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body class="bg-ink text-cream antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
