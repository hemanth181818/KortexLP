<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FDF9F3" />
    <!-- Theme before first paint, so a dark-mode visitor never sees a light flash.
         Light unless they chose dark on this site. Its own key, kortex-lp-theme:
         the old dark-first site saved "dark" under kortex-theme, which must not
         carry over. -->
    <script>
      try {
        if (localStorage.getItem("kortex-lp-theme") === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#070707");
        }
      } catch (e) {}
    </script>
    <title>Kortex · Your ad account, optimized for high ROAS every day</title>
    <meta
      name="description"
      content="Kortex reads your Meta and Google ads every day, finds where ROAS is leaking and proposes the exact fix. You approve it, Kortex makes the change, then checks whether it worked."
    />
    <meta name="author" content="Kortex" />
    <!-- The Kortex mark, inline: the deploy uploads only index.html and assets/. -->
    <link rel="icon" type="image/svg+xml" href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"%3E%3Crect width="1024" height="1024" rx="230" fill="%230F1012"/%3E%3Cpath d="M512 286V738M286 512H738M352 352L672 672M672 352L352 672" stroke="%23CCF235" stroke-width="62" stroke-linecap="round" fill="none"/%3E%3C/svg%3E' />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap"
      rel="stylesheet"
    />
    <!-- UI sans: Satoshi (Fontshare) -->
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700,900&display=swap"
      rel="stylesheet"
    />

    <meta property="og:title" content="Kortex · Your ad account, optimized for high ROAS every day" />
    <meta
      property="og:description"
      content="AI agents for high frequency ROAS optimization, on Meta and Google ads. They find where ROAS is leaking, propose the fix, and make the change once you approve it."
    />
    <meta property="og:site_name" content="Kortex" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://kortexagent.co/" />
    <!-- Who Kortex is, for search engines' rich results and for anything that reads structured data. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://kortexagent.co/#org",
            "name": "Kortex",
            "url": "https://kortexagent.co/",
            "email": "human@kortexagent.co",
            "logo": { "@type": "ImageObject", "url": "https://kortexagent.co/logo.png", "width": 1038, "height": 360 },
            "description": "AI agents for high frequency ROAS optimization on Meta and Google ads."
          },
          {
            "@type": "SoftwareApplication",
            "name": "Kortex",
            "url": "https://kortexagent.co/",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "publisher": { "@id": "https://kortexagent.co/#org" },
            "description": "Kortex reads your Meta and Google ads every day, finds where ROAS is leaking and proposes the exact fix. You approve it, Kortex makes the change, then checks whether it worked."
          }
        ]
      }
    </script>
  </head>

  <body class="bg-ink text-cream antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
